name: Deliver TikTok video to repository root
on:
  workflow_run:
    workflows: [TikTok American voice ad, TikTok corrected shield]
    types: [completed]
    branches: [promo/tiktok-american, main]
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.id != 36434582079
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: tiktok-american-1080x1920
          path: delivery/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: prepared-scene
          path: build/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Master continuous audio and exact video timing
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          curl --fail --retry 3 -L https://download.blender.org/release/Blender4.3/blender-4.3.2-linux-x64.tar.xz -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          /tmp/blender-4.3.2-linux-x64/blender -b build/ad.blend --python tools/video/master_ci.py
      - uses: actions/upload-artifact@v4
        with:
          name: tiktok-final-main
          path: delivery/
          retention-days: 90
      - name: Put finished video and companion files in root
        run: |
          cp delivery/tiktok-american.mp4 tiktok-american.mp4
          cp delivery/preview.png tiktok-preview.png
          cp delivery/subtitles.srt tiktok-american.srt
          cp delivery/licenses.txt tiktok-licenses.txt
          cp delivery/README.md TIKTOK-VIDEO.md
          sed -i 's/subtitles.srt/tiktok-american.srt/g; s/Review images: frame-\*.png./Preview: tiktok-preview.png./g' TIKTOK-VIDEO.md
          git add tiktok-american.mp4 tiktok-preview.png tiktok-american.srt tiktok-licenses.txt TIKTOK-VIDEO.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add finished American TikTok ad to repository root'
          git pull --rebase origin main
          git push origin HEAD:main
